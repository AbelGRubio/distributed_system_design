version: '3.8'

services:
  # ============================================================================
  # Reverse Proxy / API Gateway
  # ============================================================================
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--api.insecure=true" # Habilita el Dashboard de Traefik (solo para entorno de desarrollo)
      - "--providers.docker=true" # Activa la detección automática de contenedores Docker
      - "--providers.docker.exposedbydefault=false" # Solo expone los contenedores con label explícita
      - "--entrypoints.web.address=:80" # Define el puerto HTTP de entrada
    ports:
      - "80:80"       # Puerto para tráfico HTTP público
      - "8080:8080"   # Puerto para la UI del Dashboard de Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Permite a Traefik leer eventos del socket de Docker
    networks:
      - event-architecture-network

# ============================================================================
  # Application Services (Split Workers using CLI)
  # ============================================================================

  # Worker Producer
  worker-producer:
    image: github.com/abelgrubio/hexagonal_architecture:v0.1.0
    container_name: worker_producer
    command: ["opentelemetry-instrument","event-driven", "start", "producer"]
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - OTEL_SERVICE_NAME=worker-producer

      # === Configuración OTEL Unificada (lo más importante) ===
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc

      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_PROPAGATORS=tracecontext,baggage

      # Logs Python
      - OTEL_PYTHON_LOG_CORRELATION=true
      - OTEL_PYTHON_LOG_LEVEL=INFO
      - OTEL_SEMCONV_STABILITY_OPT_IN=http
    depends_on:
      - rabbitmq
      - otel-collector
    networks:
      - event-architecture-network

  # Worker Inventory
  worker-inventory:
    image: github.com/abelgrubio/hexagonal_architecture:v0.1.0
    container_name: worker_inventory
    command: ["opentelemetry-instrument", "event-driven", "start", "inventory"]
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - OTEL_SERVICE_NAME=worker-inventory

      # === Configuración OTEL Unificada (lo más importante) ===
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc

      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_PROPAGATORS=tracecontext,baggage

      # Logs Python
      - OTEL_PYTHON_LOG_CORRELATION=true
      - OTEL_PYTHON_LOG_LEVEL=INFO
      - OTEL_SEMCONV_STABILITY_OPT_IN=http
    depends_on:
      - rabbitmq
      - otel-collector
    networks:
      - event-architecture-network

  # Worker Order
  worker-order:
    image: github.com/abelgrubio/hexagonal_architecture:v0.1.0
    container_name: worker_order
    command: ["opentelemetry-instrument", "event-driven", "start", "order"]
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

      - OTEL_SERVICE_NAME=worker-order

      # === Configuración OTEL Unificada (lo más importante) ===
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc

      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_PROPAGATORS=tracecontext,baggage

      # Logs Python
      - OTEL_PYTHON_LOG_CORRELATION=true
      - OTEL_PYTHON_LOG_LEVEL=INFO
      - OTEL_SEMCONV_STABILITY_OPT_IN=http
    depends_on:
      - rabbitmq
      - otel-collector
    networks:
      - event-architecture-network

  # Worker Payment
  worker-payment:
    image: github.com/abelgrubio/hexagonal_architecture:v0.1.0
    container_name: worker_payment
    command: ["opentelemetry-instrument", "event-driven", "start", "payment"]
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - OTEL_SERVICE_NAME=worker-payment

      # === Configuración OTEL Unificada (lo más importante) ===
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc

      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_PROPAGATORS=tracecontext,baggage

      # Logs Python
      - OTEL_PYTHON_LOG_CORRELATION=true
      - OTEL_PYTHON_LOG_LEVEL=INFO
      - OTEL_SEMCONV_STABILITY_OPT_IN=http
    depends_on:
      - rabbitmq
      - otel-collector
    networks:
      - event-architecture-network

  # Worker Notification
  worker-notification:
    image: github.com/abelgrubio/hexagonal_architecture:v0.1.0
    container_name: worker_notification
    command: ["opentelemetry-instrument", "event-driven", "start", "notification"]
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - OTEL_SERVICE_NAME=worker-notification

      # === Configuración OTEL Unificada (lo más importante) ===
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc

      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_PROPAGATORS=tracecontext,baggage

      # Logs Python
      - OTEL_PYTHON_LOG_CORRELATION=true
      - OTEL_PYTHON_LOG_LEVEL=INFO
      - OTEL_SEMCONV_STABILITY_OPT_IN=http
    depends_on:
      - rabbitmq
      - otel-collector
    networks:
      - event-architecture-network

  # ============================================================================
  # Core Infrastructure
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # Puerto AMQP
      - "15672:15672" # Dashboard de administración
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - event-architecture-network

  # ============================================================================
  # Observability & Tracing Infrastructure
  # ============================================================================
  otel-collector:
    platform: linux/amd64
    image: otel/opentelemetry-collector:0.148.0
    container_name: otel-collector
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml
    command: [ "--config=/etc/otel/config.yaml" ]
    ports:
      - "4317:4317"  # Recibidor OTLP gRPC
      - "4318:4318"  # Recibidor OTLP HTTP
      - "9464:9464"  # Endpoint para métricas de Prometheus
    depends_on:
      - jaeger
      - loki
      - tempo
    networks:
      - event-architecture-network

  tempo:
    image: grafana/tempo:2.10.3
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200" # API de Tempo para Grafana
    networks:
      - event-architecture-network

  jaeger:
    platform: linux/amd64
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI de Jaeger
      - "14250:14250" # gRPC Thrift
    networks:
      - event-architecture-network

  prometheus:
    image: prom/prometheus:v3
    container_name: prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    networks:
      - event-architecture-network

  grafana:
    platform: linux/amd64
    image: grafana/grafana:12.4.2
    container_name: grafana
    ports:
      - "4000:3000" # UI de Grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - event-architecture-network
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  loki:
    platform: linux/amd64
    image: grafana/loki:3.7
    container_name: loki
    ports:
      - "3100:3100"
      - "9096:9096"
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml
    command: -config.file=/etc/loki/loki.yaml
    networks:
      - event-architecture-network

# ============================================================================
# Networks & Volumes Configuration
# ============================================================================
networks:
  event-architecture-network:
    driver: bridge

volumes:
  grafana:
  tempo_data: